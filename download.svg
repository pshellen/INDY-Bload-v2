<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="title desc">
  <title id="title">Open Caption icon</title>
  <desc id="desc">A blue caption screen containing the letters OC and two caption lines.</desc>

  <!-- Transparent background -->
  <rect x="5" y="5" width="310" height="230" rx="32"
        fill="#0787C8" stroke="#FFFFFF" stroke-width="10"/>
  <rect x="27" y="27" width="266" height="186" rx="18"
        fill="#046FA8" stroke="#8ED8F8" stroke-width="4"/>

  <text x="160" y="148"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="112"
        font-weight="900"
        letter-spacing="-5"
        text-anchor="middle">OC</text>

  <rect x="74" y="170" width="172" height="12" rx="6" fill="#FFFFFF" opacity="0.95"/>
  <rect x="106" y="192" width="108" height="10" rx="5" fill="#FFFFFF" opacity="0.72"/>
</svg>
